[package]
name = "git-dragon"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Draw a pixel-art dragon from a GitHub account's public activity, as a looping GIF for a profile README."
repository = "https://github.com/Saransh1220/git-dragon"
documentation = "https://docs.rs/git-dragon"
readme = "README.md"
license = "MIT"
keywords = ["github", "profile", "dragon", "pixel-art", "gif"]
categories = ["command-line-utilities", "visualization"]
exclude = ["/.github", "/docs"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
gif = { version = "0.14", default-features = false, features = ["std"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
