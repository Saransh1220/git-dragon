# Copy into your profile repository as .github/workflows/dragon.yml, then embed
# <img src="dragon/dragon.gif" width="256" alt="My dragon"> in its README.md.
name: Dragon

on:
  schedule:
    # Just after midnight UTC, so the dragon shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/dragon.yml]

permissions:
  contents: write

concurrency: dragon

jobs:
  dragon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Saransh1220/git-dragon@v1
        with:
          body: emerald
          output-dir: dragon
      - name: Commit the dragon if it changed
        shell: bash
        run: |
          git add dragon/dragon.gif
          if git diff --cached --quiet; then
            echo "The dragon is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "dragon: draw the day's dragon"
          git push --quiet
